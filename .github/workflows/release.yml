name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to create and push (for example v0.1.0)
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.version || github.ref_name }}

jobs:
  tag:
    name: Tag and push
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create and push tag
        run: |
          set -euo pipefail
          version="${{ env.RELEASE_TAG }}"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must look like v0.1.0" >&2
            exit 1
          fi
          if git rev-parse "$version" >/dev/null 2>&1; then
            echo "tag $version already exists" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "$version"
          git push origin "$version"

  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [tag]
    if: always() && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64, "386"]
        exclude:
          - goos: darwin
            goarch: "386"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then
            ext=".exe"
          fi
          out="keypair-generator-${GOOS}-${GOARCH}${ext}"
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/${out}" ./cmd/keypair-generator

      - uses: actions/upload-artifact@v4
        with:
          name: keypair-generator-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [tag, build]
    if: always() && (needs.tag.result == 'success' || needs.tag.result == 'skipped') && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * | tee checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.RELEASE_TAG }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ env.RELEASE_TAG }}" \
            --generate-notes
